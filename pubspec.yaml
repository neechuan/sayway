name: saymyway
description: "SayMyWay — AAC communication app for everyone"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Text-to-Speech
  flutter_tts: ^4.2.0

  # Local Storage (offline-first)
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Audio Feedback
  just_audio: ^0.9.42

  # UI Utilities
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  shimmer: ^3.0.0

  # Utils
  uuid: ^4.5.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

  assets:
    - assets/symbols/
    - assets/images/
    - assets/audio/


